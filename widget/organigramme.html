<!DOCTYPE html>
<!--
  Organigramme — DGOM (charte de l'État / DSFR)
  RÔLE
    Dessine l'organigramme à partir des Entités (Gouv_Entites) et des personnes qui y sont rattachées
    (Gouv_Utilisateurs). Il se met à jour tout seul : ajouter une entité, changer son rattachement, sa couleur,
    ou rattacher une personne suffit, rien n'est à dessiner à la main.
    Rendu repris de l'organigramme de l'Outil cabDG (cases à bandeau de couleur, chef, adjoint, membres).

  INSTALLATION DANS GRIST
    Créée par Maintenance › Modules facultatifs › « 🏢 Organigramme » › Installer (module bureaux_dgom),
    qui ajoute aussi aux Entités les bureaux de la DGOM. Widget lié à Gouv_Entites. Ce widget n'écrit rien.

  COLONNES LUES
    Gouv_Entites      : Nom, Parent (l'entité au-dessus), Courriel (secrétariat), Couleur (vide = celle de
                        l'entité au-dessus), Organigramme (décochée : pas dessinée), Actif ;
    Gouv_Utilisateurs : Nom, Entite, Fonction (« Chef de bureau », « Adjoint »… : place la personne en tête), Actif.

  TROIS VUES
    - Entités seules : les noms des entités et leur effectif ;
    - Responsables   : en plus, le chef et l'adjoint de chaque entité ;
    - Détaillée      : toutes les personnes.
  Un clic sur le triangle d'une case replie ce qui en dépend ; la recherche met en avant les entités
  ou les personnes trouvées.

  DISPOSITION (celle d'un organigramme classique)
    - la direction en haut ;
    - les entités sans sous-entité (cabinet, missions…) de part et d'autre du trait vertical ;
    - les sous-directions côte à côte en dessous, chacune avec ses bureaux en colonne.
    Les traits sont dessinés après coup (SVG), d'après la place réelle des cases.
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organigramme</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script>
    // Fichiers communs chargés avec la version de la page (?v=…) : jamais d'ancienne copie en cache.
    const VERSION_PAGE = new URLSearchParams(location.search).get('v') || '';
    const RECHARGE = new URLSearchParams(location.search).get('r') || '';
    const commun = (fichier) => 'commun/' + fichier + (VERSION_PAGE ? '?v=' + VERSION_PAGE : '') + (RECHARGE ? '&r=' + RECHARGE : '');
    document.write('<link rel="stylesheet" href="' + commun('dsfr-grist.css') + '">');
    document.write('<script src="' + commun('outils.js') + '"><\/script>');
  </script>
  <style>
    body { background: #fff; }
    /* Barre du haut : titre, chiffres, puis les réglages de la vue */
    .entete-orga { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px; border-bottom: 1px solid var(--bordure); }
    .entete-orga h1 { font-size: 20px; margin: 0; }
    .entete-orga .chiffres { color: var(--texte-doux); font-size: 13.5px; flex: 1; }
    .entete-orga select, .entete-orga input[type=search] { font: inherit; font-size: 14px; padding: 5px 8px; border: 1px solid var(--bordure); border-radius: 4px; }
    .entete-orga input[type=search] { width: 220px; }
    .entete-orga label { font-size: 13.5px; display: flex; align-items: center; gap: 4px; }

    .zone { overflow: auto; padding: 24px 16px 40px; }
    #arbre { position: relative; display: inline-block; min-width: 100%; }
    #traits { position: absolute; left: 0; top: 0; pointer-events: none; }
    #traits path { fill: none; stroke: #9a9a9a; stroke-width: 1.5; }

    /* Une entité : sa case, puis ce qui en dépend */
    .noeud { display: flex; flex-direction: column; align-items: center; }
    .boite { position: relative; z-index: 1; width: 190px; background: #fff; border: 1px solid #d6d6d6; border-radius: 6px;
      box-shadow: 0 1px 3px rgba(0,0,18,.12); overflow: hidden; cursor: pointer; text-align: left; }
    .boite:hover { box-shadow: 0 0 0 2px var(--bleu); }
    .boite .tete { display: flex; align-items: center; gap: 6px; padding: 7px 10px; }
    .boite .tete b { flex: 1; font-size: 14.5px; }
    .boite .tete small { font-size: 11.5px; white-space: nowrap; opacity: .85; }
    .boite .replier { border: none; background: none; color: inherit; cursor: pointer; padding: 0 2px; font-size: 12px; }
    .boite .courriel { display: block; padding: 3px 10px 0; font-size: 11px; color: var(--texte-doux); word-break: break-all; }
    .boite ul { list-style: none; margin: 0; padding: 4px 6px 7px; font-size: 12.5px; }
    .boite li { padding: 1px 4px 1px 18px; }
    .boite li.chef { padding-left: 4px; font-weight: 700; background: #f0f0f0; border-radius: 3px; margin-bottom: 1px; }
    .boite li.adjoint { padding-left: 4px; font-weight: 600; }
    .boite li.inactif { color: #9a9a9a; text-decoration: line-through; }
    .boite li small { font-weight: 400; color: var(--texte-doux); }
    .racine > .boite { width: 230px; } .racine > .boite .tete b { font-size: 17px; }
    /* recherche : les cases trouvées ressortent, les autres s'effacent */
    .boite.trouvee { box-shadow: 0 0 0 3px #ff9940; }
    .boite.estompee { opacity: .3; }
    li.trouve { background: #ffe9c2; }

    .rattaches { display: grid; grid-template-columns: 1fr 48px 1fr; margin-top: 18px; }
    .rattaches .cote { display: flex; flex-direction: column; gap: 10px; }
    .rattaches .g { align-items: flex-end; } .rattaches .d { align-items: flex-start; }
    .branches { display: flex; gap: 20px; margin-top: 34px; align-items: flex-start; }
    .pile { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; padding-left: 26px; align-self: stretch; }

    .vide { padding: 40px 16px; color: var(--texte-doux); }
    @media print {
      .entete-orga select, .entete-orga input, .entete-orga label, .entete-orga button { display: none; }
      .zone { overflow: visible; padding: 0; }
      .boite.estompee { opacity: 1; }
      @page { size: landscape; margin: 8mm; }
    }
  </style>
</head>
<body>
  <div class="entete-orga">
    <h1>🏢 Organigramme</h1>
    <span class="chiffres" id="chiffres"></span>
    <select id="vue" aria-label="Vue">
      <option value="entites">Entités seules</option>
      <option value="responsables">Responsables (chef, adjoint)</option>
      <option value="detaillee">Détaillée (toutes les personnes)</option>
    </select>
    <input type="search" id="cherche" placeholder="Rechercher une entité ou une personne" aria-label="Rechercher">
    <label><input type="checkbox" id="inactifs"> Inactifs</label>
    <button class="bouton petit" id="deplier">Tout déplier</button>
    <button class="bouton petit" id="replier">Tout replier</button>
    <button class="bouton petit" id="imprimer" title="Pour un fichier : choisir « Enregistrer au format PDF »">🖨️ Imprimer</button>
  </div>
  <div class="zone"><div id="arbre"><p class="vide">Chargement…</p></div></div>

<script>
  const esc = (t) => Outils.esc(t);
  grist.ready({ requiredAccess: 'full' });   // lecture des Entités et des Utilisateurs ; ce widget n'écrit rien

  let ENTITES = [], PERSONNES = [];
  const replies = new Set();   // entités repliées
  // Réglage propre à chaque personne, gardé dans son navigateur (sans conséquence s'il est indisponible)
  const memoire = { lire: (k, d) => { try { return localStorage.getItem('organigramme.' + k) || d; } catch (e) { return d; } },
    ecrire: (k, v) => { try { localStorage.setItem('organigramme.' + k, v); } catch (e) { /* navigateur sans stockage */ } } };
  document.getElementById('vue').value = memoire.lire('vue', 'responsables');

  /** Une table entière en lignes { colonne: valeur } (références = numéro de la ligne visée) ; [] si elle n'existe pas. */
  async function lireTable(table) {
    try {
      const t = await grist.docApi.fetchTable(table);
      return (t.id || []).map((id, i) => Object.fromEntries(Object.keys(t).map((c) => [c, t[c][i]])));
    } catch (e) { return []; }
  }

  // Place d'une personne dans sa case, d'après sa fonction
  const estAdjoint = (p) => /adjoint/i.test(p.Fonction || '');
  const estChef = (p) => !estAdjoint(p) && /chef|directeur|directrice|responsable/i.test(p.Fonction || '');
  const rang = (p) => (estChef(p) ? 0 : estAdjoint(p) ? 1 : 2);

  /** Texte noir ou blanc selon la couleur de fond (lisibilité). */
  function texteSur(couleur) {
    const m = /^#?([0-9a-f]{6})$/i.exec(couleur || '');
    if (!m) return '#161616';
    const n = parseInt(m[1], 16), r = n >> 16, v = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * v + 0.114 * b) > 150 ? '#161616' : '#ffffff';
  }

  /**
   * Arbre des entités dessinées. Une entité masquée (inactive ou décochée « Dans l'organigramme ») laisse
   * ses sous-entités à l'entité au-dessus. Chaque nœud garde ses personnes, triées chef, adjoint, puis par nom.
   */
  function construireArbre() {
    const parId = new Map(ENTITES.map((l) => [l.id, l]));
    const visible = (l) => l.Actif !== false && l.Organigramme !== false;
    const noeuds = new Map(ENTITES.filter(visible).map((l) => [l.id, { ligne: l, enfants: [], personnes: [] }]));
    const parentVisible = (l) => {
      const vus = new Set([l.id]);
      let p = parId.get(l.Parent);
      while (p && !noeuds.has(p.id) && !vus.has(p.id)) { vus.add(p.id); p = parId.get(p.Parent); }
      return p && noeuds.has(p.id) && p.id !== l.id ? noeuds.get(p.id) : null;
    };
    const racines = [];
    for (const n of noeuds.values()) (parentVisible(n.ligne) || { enfants: racines }).enfants.push(n);
    for (const p of PERSONNES) if (noeuds.has(p.Entite)) noeuds.get(p.Entite).personnes.push(p);
    const parNom = (a, b) => String(a.ligne.Nom || '').localeCompare(String(b.ligne.Nom || ''), 'fr');
    for (const n of noeuds.values()) {
      n.enfants.sort(parNom);
      n.personnes.sort((a, b) => rang(a) - rang(b) || String(a.Nom || '').localeCompare(String(b.Nom || ''), 'fr'));
    }
    const colorier = (n, heritee) => { n.couleur = n.ligne.Couleur || heritee || ''; n.enfants.forEach((e) => colorier(e, n.couleur)); };
    racines.sort(parNom).forEach((r) => colorier(r, ''));
    return { racines, noeuds };
  }

  /** La case d'une entité : bandeau (nom, effectif, triangle pour replier), courriel, puis les personnes selon la vue. */
  function boite(n, recherche) {
    const l = n.ligne, fond = n.couleur || '#e3e3fd', vue = document.getElementById('vue').value;
    const inactifs = document.getElementById('inactifs').checked;
    const actifs = n.personnes.filter((p) => p.Actif !== false);
    // selon la vue ; une personne trouvée par la recherche est toujours montrée
    const montrees = (inactifs ? n.personnes : actifs).filter((p) => vue === 'detaillee' || (vue === 'responsables' && rang(p) < 2)
      || (recherche && String(p.Nom || '').toLowerCase().includes(recherche)));
    const trouvee = recherche && (String(l.Nom || '').toLowerCase().includes(recherche) || n.personnes.some((p) => String(p.Nom || '').toLowerCase().includes(recherche)));
    const triangle = n.enfants.length ? `<button class="replier" data-replier="${l.id}" title="${replies.has(l.id) ? 'Déplier' : 'Replier'}">${replies.has(l.id) ? '▸' : '▾'}</button>` : '';
    const personne = (p) => `<li class="${['chef', 'adjoint', ''][rang(p)]}${p.Actif === false ? ' inactif' : ''}${recherche && String(p.Nom || '').toLowerCase().includes(recherche) ? ' trouve' : ''}"` +
      ` title="${esc(p.Fonction || '')}">${esc(p.Nom || '')}${rang(p) < 2 && p.Fonction ? ` <small>${esc(p.Fonction)}</small>` : ''}</li>`;
    return `<div class="boite${recherche ? (trouvee ? ' trouvee' : ' estompee') : ''}" data-id="${l.id}" title="${esc(l.Nom_complet || l.Nom || '')}">` +
      `<div class="tete" style="background:${esc(fond)};color:${texteSur(fond)}">${triangle}<b>${esc(l.Nom || '(sans nom)')}</b>` +
      `${actifs.length ? `<small>${actifs.length} pers.</small>` : ''}</div>` +
      (l.Courriel && vue !== 'entites' ? `<a class="courriel" href="mailto:${esc(l.Courriel)}">${esc(l.Courriel)}</a>` : '') +
      (montrees.length ? `<ul>${montrees.map(personne).join('')}</ul>` : '') + '</div>';
  }

  /** Une entité et tout ce qui en dépend (voir DISPOSITION en tête du fichier). */
  function dessiner(n, profondeur, recherche) {
    const enfants = replies.has(n.ligne.id) ? [] : n.enfants;
    const feuilles = enfants.filter((e) => !e.enfants.length), branches = enfants.filter((e) => e.enfants.length);
    let h = `<div class="noeud${profondeur === 0 ? ' racine' : ''}" data-noeud="${n.ligne.id}">${boite(n, recherche)}`;
    if (profondeur > 0 && !branches.length) {
      if (feuilles.length) h += `<div class="pile" data-pile="${n.ligne.id}">${feuilles.map((f) => boite(f, recherche)).join('')}</div>`;
    } else {
      if (feuilles.length) {
        const moitie = Math.ceil(feuilles.length / 2);
        h += `<div class="rattaches" data-rattaches="${n.ligne.id}"><div class="cote g">${feuilles.slice(0, moitie).map((f) => boite(f, recherche)).join('')}</div><div></div>` +
          `<div class="cote d">${feuilles.slice(moitie).map((f) => boite(f, recherche)).join('')}</div></div>`;
      }
      if (branches.length) h += `<div class="branches" data-branches="${n.ligne.id}">${branches.map((b) => dessiner(b, profondeur + 1, recherche)).join('')}</div>`;
    }
    return h + '</div>';
  }

  /** Les traits, d'après la place réelle des cases (après chaque dessin et à chaque redimensionnement). */
  function tracer() {
    const arbre = document.getElementById('arbre');
    const ancien = document.getElementById('traits'); if (ancien) ancien.remove();
    const o = arbre.getBoundingClientRect();
    const r = (el) => { const b = el.getBoundingClientRect(); return { g: b.left - o.left, d: b.right - o.left, h: b.top - o.top, b: b.bottom - o.top, x: (b.left + b.right) / 2 - o.left, y: b.top - o.top + 16 }; };
    const chemins = [];
    for (const noeud of arbre.querySelectorAll('.noeud')) {
      const id = noeud.dataset.noeud, p = r(noeud.querySelector(':scope > .boite'));
      const rat = noeud.querySelector(`:scope > [data-rattaches="${id}"]`);
      const bra = noeud.querySelector(`:scope > [data-branches="${id}"]`);
      const pile = noeud.querySelector(`:scope > [data-pile="${id}"]`);
      let basTronc = p.b;
      if (rat) {
        // trait vertical sous la case, et un trait horizontal vers chaque entité de côté (à hauteur de son bandeau)
        for (const c of rat.querySelectorAll('.boite')) {
          const e = r(c);
          chemins.push(`M${p.x},${e.y}H${c.closest('.g') ? e.d : e.g}`);
          basTronc = Math.max(basTronc, e.y);
        }
      }
      if (bra) {
        const enfants = [...bra.children].map((x) => r(x.querySelector(':scope > .boite')));
        const bus = Math.min(...enfants.map((e) => e.h)) - 16;
        basTronc = bus;
        chemins.push(`M${Math.min(p.x, ...enfants.map((e) => e.x))},${bus}H${Math.max(p.x, ...enfants.map((e) => e.x))}`);
        for (const e of enfants) chemins.push(`M${e.x},${bus}V${e.h}`);
      }
      if (rat || bra) chemins.push(`M${p.x},${p.b}V${basTronc}`);
      if (pile) {
        // bureaux en colonne : un trait qui descend à gauche, puis vers le bandeau de chaque bureau
        const x = r(pile).g + 12, cases = [...pile.children].map(r);
        chemins.push(`M${x},${p.b}V${Math.max(...cases.map((e) => e.y))}`);
        for (const e of cases) chemins.push(`M${x},${e.y}H${e.g}`);
      }
    }
    arbre.insertAdjacentHTML('afterbegin', `<svg id="traits" width="${arbre.scrollWidth}" height="${arbre.scrollHeight}"><path d="${chemins.join('')}"/></svg>`);
  }

  function afficher() {
    const arbre = document.getElementById('arbre');
    const { racines, noeuds } = construireArbre();
    const actifs = PERSONNES.filter((p) => p.Actif !== false && noeuds.has(p.Entite)).length;
    document.getElementById('chiffres').textContent = noeuds.size ? `${noeuds.size} entité(s) · ${actifs} personne(s)` : '';
    if (!racines.length) {
      arbre.innerHTML = '<p class="vide">Aucune entité à dessiner : remplissez la table Gouv_Entites (Nom, Parent).</p>';
      return;
    }
    const recherche = document.getElementById('cherche').value.trim().toLowerCase();
    arbre.innerHTML = racines.map((n) => dessiner(n, 0, recherche)).join('');
    requestAnimationFrame(tracer);
  }

  async function recharger() {
    [ENTITES, PERSONNES] = await Promise.all([lireTable('Gouv_Entites'), lireTable('Gouv_Utilisateurs')]);
    afficher();
  }

  // Gestes : triangle (replier), clic sur une case (sélection dans la table), réglages de la barre
  document.getElementById('arbre').addEventListener('click', (e) => {
    const t = e.target.closest('[data-replier]');
    if (t) { const id = Number(t.dataset.replier); replies.has(id) ? replies.delete(id) : replies.add(id); afficher(); return; }
    const b = e.target.closest('.boite');
    if (b && !e.target.closest('a')) grist.setCursorPos({ rowId: Number(b.dataset.id) }).catch(() => {});
  });
  document.getElementById('vue').addEventListener('change', (e) => { memoire.ecrire('vue', e.target.value); afficher(); });
  document.getElementById('cherche').addEventListener('input', afficher);
  document.getElementById('inactifs').addEventListener('change', afficher);
  document.getElementById('deplier').addEventListener('click', () => { replies.clear(); afficher(); });
  document.getElementById('replier').addEventListener('click', () => {
    // replie les sous-directions : la direction et ses entités directes restent visibles
    const { racines } = construireArbre();
    replies.clear();
    racines.forEach((r) => r.enfants.forEach((e) => { if (e.enfants.length) replies.add(e.ligne.id); }));
    afficher();
  });
  document.getElementById('imprimer').addEventListener('click', () => window.print());
  window.addEventListener('resize', () => requestAnimationFrame(tracer));
  window.addEventListener('beforeprint', tracer);

  // Prévenu à chaque changement des Entités ; les Utilisateurs sont relus en même temps
  grist.onRecords(recharger);
</script>
</body>
</html>
