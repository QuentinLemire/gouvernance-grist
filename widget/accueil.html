<!DOCTYPE html>
<!--
  =====================================================================
  Page d'accueil — DGOM (charte de l'État / DSFR)
  =====================================================================
  Widget à poser sur la page « Accueil », lié à la table Accueil, niveau
  d'accès « Accès complet au document ».

  Ce que voit chaque personne (les règles d'accès Grist font le tri) :
    - non inscrite : le message « accès réservé » (Accueil.Message, calculé
      depuis Parametres), les 3 étapes pour obtenir un accès et un bouton qui
      prépare le courriel au contact ;
    - inscrite : la confirmation de son accès et les 3 dernières pages
      « Nouveauté » de la documentation.
  =====================================================================
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accueil</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/component/logo/logo.min.css">
  <link rel="stylesheet" href="commun/dsfr-grist.css">
  <script src="commun/outils.js"></script>
  <style>
    .bandeau { background: var(--bleu); color: #fff; padding: 36px 24px; }
    .bandeau > div { max-width: 1280px; margin: 0 auto; }
    .bandeau h2 { font-size: 30px; margin: 0 0 8px; }
    .bandeau p { margin: 0; font-size: 17px; opacity: .92; }
    .acces-reserve { border-left: 6px solid var(--erreur); background: #fff; padding: 24px 28px; margin-bottom: 24px; box-shadow: 0 1px 3px rgba(0,0,18,.12); }
    .acces-reserve h1 { font-size: 24px; }
    .etapes { margin: 0 0 16px; padding-left: 22px; } .etapes li { margin: 8px 0; }
    .nouveaute { padding: 12px 0; border-bottom: 1px solid var(--bordure); }
    .nouveaute:last-child { border-bottom: none; }
    .nouveaute small { color: var(--texte-doux); }
  </style>
</head>
<body>

<header class="entete">
  <p class="fr-logo">Ministère<br>des Outre-mer</p>
  <div class="dgom" id="logo-dgom"><span>DGOM</span></div>
  <div class="titres">
    <h1 id="titre-appli">Application DGOM</h1>
    <p>Direction générale des Outre-mer</p>
  </div>
</header>

<div id="page"><main><p class="vide">Chargement…</p></main></div>

<script>
'use strict';
const { esc, lire, parametres, entete, markdown } = window.Outils;

/** Une personne est « inscrite » si les règles d'accès la laissent lire la table Utilisateurs. */
async function afficher() {
  const [accueil, utilisateurs, docs, p] = await Promise.all([
    lire('Accueil'), lire('Utilisateurs'), lire('Documentation'), parametres(),
  ]);
  entete(p);
  const appli = p.Nom_application || "l'application";
  const message = (accueil || [])[0]?.Message || '';
  const contact = p.Contact_support || (message.match(/mailto:([^)\s]+)/) || [])[1] || '';
  const mailto = contact ? `mailto:${esc(contact)}?subject=${encodeURIComponent("Demande d'accès à " + appli)}&body=${encodeURIComponent("Bonjour,\n\nJe souhaite accéder à " + appli + ".\nMon service :\nMotif :\n\nMerci.")}` : '';
  let html;

  if (!Array.isArray(utilisateurs)) {
    // Personne sans accès : tout l'écran est consacré à l'obtenir.
    html = `<main><section class="acces-reserve markdown">${markdown(message || "# ⛔ Accès réservé\n\nPour avoir accès aux données, rapprochez-vous des administrateurs.")}</section>
      <section class="carte"><h2>Comment obtenir un accès ?</h2>
        <ol class="etapes">
          <li><b>Écrivez</b> à ${contact ? `<a href="${mailto}">${esc(contact)}</a>` : 'la DGOM'} avec votre adresse professionnelle, votre service et le motif.</li>
          <li><b>Un administrateur</b> enregistre votre adresse et vous attribue un rôle.</li>
          <li><b>Rechargez cette page</b> : les données auxquelles vous avez droit apparaissent dans le menu.</li>
        </ol>
        ${mailto ? `<p><a class="bouton primaire" href="${mailto}">✉️ Demander un accès</a></p>` : ''}
      </section></main>`;
  } else {
    // Personne inscrite : un mot d'accueil et, s'il y en a, les dernières nouveautés.
    const N = (docs || []).filter((d) => d.Rubrique === 'Nouveauté').sort((a, b) => (b.CreeLe || 0) - (a.CreeLe || 0)).slice(0, 3);
    html = `<section class="bandeau"><div><h2>✅ Vous avez accès à ${esc(appli)}</h2>
      <p>Utilisez le menu de gauche. Une question ? Page <b>Support</b>${contact ? ' ou ' + esc(contact) : ''}.</p></div></section><main>
      ${N.length ? `<section class="carte"><h2>📰 Nouveautés</h2>${N.map((n) => `<div class="nouveaute"><small>${n.CreeLe ? new Date(n.CreeLe * 1000).toLocaleDateString('fr-FR') : ''}</small><br><b>${esc(n.Titre)}</b><div class="markdown">${markdown(n.Contenu)}</div></div>`).join('')}</section>` : ''}</main>`;
  }
  document.getElementById('page').innerHTML = html;
}

grist.ready({ requiredAccess: 'full' });
grist.onRecords(afficher);   // se met à jour quand le message d'accueil change
afficher();
</script>
</body>
</html>
