<!DOCTYPE html>
<!--
  Page d'accueil — DGOM (charte de l'État / DSFR)
  RÔLE
    Première page que voit toute personne qui ouvre le document Grist.
    Elle répond à une seule question : « ai-je accès à l'application ? ».
    Si oui, elle le confirme et montre les dernières nouveautés ; si non,
    elle explique comment demander un accès.

  INSTALLATION DANS GRIST
    Widget personnalisé posé sur la page « Accueil », lié à la table
    Gouv_Accueil, niveau d'accès « Accès complet au document ». Ce niveau est
    indispensable : le widget doit pouvoir TENTER de lire d'autres tables
    pour savoir ce que la personne a le droit de voir.

  TABLES GRIST UTILISÉES (lecture seule : ce widget n'écrit rien)
    - Gouv_Accueil       : colonne Message, texte Markdown « accès réservé »
                      calculé depuis Gouv_Parametres ;
    - Gouv_Utilisateurs  : sert de test d'inscription (voir afficher()) ; une application qui garde
                           son propre registre le déclare dans Parametres (clé Table_utilisateurs) ;
    - Gouv_Documentation : pages de la rubrique « Nouveauté » ;
    - Gouv_Parametres    : Nom_application, Contact_support, Logo_DGOM.

  CE QUE VOIT CHAQUE PERSONNE (les règles d'accès Grist font le tri)
    - non inscrite : le message « accès réservé » (Gouv_Accueil.Message), les
      3 étapes pour obtenir un accès et un bouton qui prépare le courriel
      au contact ;
    - inscrite : la confirmation de son accès et les 3 dernières pages
      « Nouveauté » de la documentation.

  PLAN DU FICHIER
    1. <head> : bibliothèques externes, styles communs et styles propres ;
    2. <body> : en-tête Marianne / DGOM, puis zone « page » vide ;
    3. Script : outils communs, fonction afficher(), démarrage.
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accueil</title>
  <!-- Bibliothèques externes : API des widgets Grist (objet « grist »),
       conversion du Markdown en HTML (marked) et nettoyage de ce HTML
       (DOMPurify, qui empêche l'exécution de scripts malveillants). -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <!-- Styles : logo Marianne officiel (DSFR), charte commune à tous les
       widgets, puis outils JavaScript communs (window.Outils). -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/component/logo/logo.min.css">
  <script>
    // Fichiers communs chargés avec la version de la page (?v=…) : jamais d'ancienne copie en cache.
    const VERSION_PAGE = new URLSearchParams(location.search).get('v') || '';
    const RECHARGE = new URLSearchParams(location.search).get('r') || '';   // ?r=… : force un nouveau téléchargement
    const commun = (fichier) => 'commun/' + fichier + (VERSION_PAGE ? '?v=' + VERSION_PAGE : '') + (RECHARGE ? '&r=' + RECHARGE : '');
    document.write('<link rel="stylesheet" href="' + commun('dsfr-grist.css') + '">');
    document.write('<script src="' + commun('outils.js') + '"><\/script>');
  </script>
  <style>
    /* Bandeau bleu « Vous avez accès » affiché aux personnes inscrites. */
    .bandeau { background: var(--bleu); color: #fff; padding: 36px 24px; }
    .bandeau > div { max-width: 1280px; margin: 0 auto; }
    .bandeau h2 { font-size: 30px; margin: 0 0 8px; }
    .bandeau p { margin: 0; font-size: 17px; opacity: .92; }
    /* Encadré à liseré rouge « accès réservé » pour les personnes non inscrites. */
    .acces-reserve { border-left: 6px solid var(--erreur); background: #fff; padding: 24px 28px; margin-bottom: 24px; box-shadow: 0 1px 3px rgba(0,0,18,.12); }
    .acces-reserve h1 { font-size: 24px; }
    .carte.referent { border-left: 6px solid #000091; }
    .mention { color: #666; font-size: 13px; margin: 0 0 16px; }
    /* Liste numérotée des étapes pour obtenir un accès. */
    .etapes { margin: 0 0 16px; padding-left: 22px; } .etapes li { margin: 8px 0; }
    /* Une entrée de la liste des nouveautés, séparée de la suivante par un filet. */
    .nouveaute { padding: 12px 0; border-bottom: 1px solid var(--bordure); }
    .nouveaute:last-child { border-bottom: none; }
    .nouveaute small { color: var(--texte-doux); }
  </style>
</head>
<body>

<!-- En-tête commun : bloc-marque « Ministère des Outre-mer », logo DGOM
     (remplacé par l'image de Parametres.Logo_DGOM s'il existe) et nom de
     l'application (remplacé par Parametres.Nom_application). -->
<header class="entete">
  <p class="fr-logo">Ministère<br>des Outre-mer</p>
  <div class="dgom" id="logo-dgom"><span>DGOM</span></div>
  <div class="titres">
    <h1 id="titre-appli">Application DGOM</h1>
    <p>Direction générale des Outre-mer</p>
  </div>
</header>

<!-- Zone principale : affiche « Chargement… » puis est entièrement
     remplacée par la fonction afficher() du script ci-dessous. -->
<div id="page"><main><p class="vide">Chargement…</p></main></div>

<script>
'use strict';

// ===== 1. Outils communs =====
// Fonctions partagées par tous les widgets (fichier commun/outils.js) :
//   esc        : neutralise les caractères HTML d'un texte saisi (sécurité) ;
//   lire       : lit une table Grist ; rend null si l'accès est refusé ;
//   parametres : lit la table Parametres sous forme { Cle: Valeur } ;
//   entete     : met le logo et le nom de l'application dans l'en-tête ;
//   markdown   : transforme un texte Markdown en HTML sûr.
const { esc, lire, parametres, entete, markdown } = window.Outils;
// Le support Grist DGOM (demandes des référents au BSSIOM) ; remplaçable par le paramètre Lien_support_grist.
const SUPPORT_GRIST = 'https://grist.numerique.gouv.fr/o/arrivees-departsmom/ii79VDftXMj9/p/12';

// ===== 2. Affichage de la page =====

/**
 * Construit et affiche tout le contenu de la page d'accueil.
 *
 * Comment sait-on si la personne est « inscrite » ? Le widget essaie de
 * lire la table Utilisateurs : les règles d'accès Grist ne l'autorisent
 * qu'aux personnes enregistrées. Si la lecture échoue (Outils.lire rend
 * alors null au lieu d'une liste), la personne n'a pas encore d'accès.
 * Aucun contrôle de sécurité n'est fait ici : c'est Grist qui décide,
 * le widget se contente d'adapter l'affichage.
 *
 * Paramètres : aucun (Grist peut lui passer des lignes, elles sont ignorées).
 * Valeur rendue : aucune (promesse sans résultat utile).
 * Effet sur le document Grist : aucun, lecture seule. Seul le contenu de
 * l'élément #page de cet écran est remplacé.
 */
async function afficher() {
  // Lecture des 4 sources en parallèle (plus rapide). Une table interdite
  // par les règles d'accès donne null, sans provoquer d'erreur.
  // Paramètres d'abord : ils disent quelle table recense les personnes (Gouv_Utilisateurs, ou le registre
  // propre à l'application, clé Table_utilisateurs)
  const p = await parametres();
  const [accueil, utilisateurs, docs, tables] = await Promise.all([
    lire('Gouv_Accueil'), lire(p.Table_utilisateurs || 'Gouv_Utilisateurs'), lire('Gouv_Documentation'),
    // Tables du document : le module Support (hors socle) n'est cité que s'il est installé.
    grist.docApi.listTables().catch(() => []),
  ]);
  entete(p);
  // Nom affiché de l'application et message « accès réservé » de la table Accueil.
  const appli = p.Nom_application || "l'application";
  const message = (accueil || [])[0]?.Message || '';
  // Adresse du contact : celle des paramètres, sinon la première adresse
  // « mailto: » trouvée dans le message d'accueil (une personne non inscrite
  // ne peut pas forcément lire Parametres, mais voit toujours ce message).
  const contact = p.Contact_support || (message.match(/mailto:([^)\s]+)/) || [])[1] || '';
  // Lien qui ouvre la messagerie avec un courriel de demande d'accès
  // pré-rempli (objet et corps), pour faciliter la démarche.
  const mailto = contact ? `mailto:${esc(contact)}?subject=${encodeURIComponent("Demande d'accès à " + appli)}&body=${encodeURIComponent("Bonjour,\n\nJe souhaite accéder à " + appli + ".\nMon service :\nMotif :\n\nMerci.")}` : '';
  let html;

  // Choix de l'écran selon le résultat de la lecture de Utilisateurs : une personne inscrite y voit au moins
  // sa propre ligne ; une personne sans accès reçoit null (table interdite) ou une liste vide (lignes masquées).
  if (!Array.isArray(utilisateurs) || !utilisateurs.length) {
    // Personne sans accès : tout l'écran est consacré à l'obtenir.
    html = `<main><section class="acces-reserve markdown">${markdown(message || "# ⛔ Accès réservé\n\nPour avoir accès aux données, rapprochez-vous des administrateurs.")}</section>
      <section class="carte"><h2>Comment obtenir un accès ?</h2>
        <ol class="etapes">
          <li><b>Écrivez</b> à ${contact ? `<a href="${mailto}">${esc(contact)}</a>` : 'la DGOM'} avec votre adresse professionnelle, votre service et le motif.</li>
          <li><b>Un administrateur</b> enregistre votre adresse et vous rattache à votre entité (direction, bureau…).</li>
          <li><b>Rechargez cette page</b> : les données auxquelles vous avez droit apparaissent dans le menu.</li>
        </ol>
        ${mailto ? `<p><a class="bouton primaire" href="${mailto}">✉️ Demander un accès</a></p>` : ''}
      </section></main>`;
  } else {
    // Personne inscrite : un mot d'accueil et, s'il y en a, les dernières nouveautés.
    // Les 3 pages « Nouveauté » les plus récentes (CreeLe est une date Grist,
    // exprimée en secondes : on la multiplie par 1000 pour l'afficher).
    const N = (docs || []).filter((d) => d.Rubrique === 'Nouveauté').sort((a, b) => (b.CreeLe || 0) - (a.CreeLe || 0)).slice(0, 3);
    // Référent de ce Grist (Maintenance › Paramètres, clé Referents) : lien vers le support Grist DGOM, pour lui seul.
    // Qui est connecté : la ligne d'Utilisateurs dont « Est moi » est vrai (règle de colonne de la norme) ;
    // à défaut, la seule ligne lisible.
    const moi = utilisateurs.find((u) => u.Est_moi === true) || (utilisateurs.length === 1 ? utilisateurs[0] : null);
    const referents = String(p.Referents || '').split(',').map((c) => c.trim().toLowerCase()).filter(Boolean);
    const referent = !!moi && referents.includes(String(moi.Courriel || '').trim().toLowerCase());
    const lienSupport = p.Lien_support_grist || SUPPORT_GRIST;
    html = `<section class="bandeau"><div><h2>✅ Vous avez accès à ${esc(appli)}</h2>
      <p>Utilisez le menu de gauche.${tables.includes('Gouv_Support') ? ` Une question ? Page <b>Support</b>${contact ? ' ou ' + esc(contact) : ''}.` : contact ? ` Une question ? Écrivez à ${esc(contact)}.` : ''}</p></div></section><main>
      ${referent ? `<section class="carte referent"><h2>🎫 Vous êtes référent de ce Grist</h2>
        <p>Une évolution, un problème, un accès à ouvrir ? Faites votre demande au BSSIOM sur le support Grist DGOM : vous y suivez
          aussi vos demandes et leurs réponses.</p>
        <p><a class="bouton primaire" href="${esc(lienSupport)}" target="_blank" rel="noopener">Faire une demande au support ↗</a></p></section>` : ''}
      ${tables.includes('Gouv_Visites') ? `<p class="mention">ℹ️ La date de votre dernière ouverture de ce document est conservée (une seule date, pas d'historique) pour compter les utilisateurs actifs. Seuls les propriétaires du document la voient.</p>` : ''}
      ${N.length ? `<section class="carte"><h2>📰 Nouveautés</h2>${N.map((n) => `<div class="nouveaute"><small>${n.CreeLe ? new Date(n.CreeLe * 1000).toLocaleDateString('fr-FR') : ''}</small><br><b>${esc(n.Titre)}</b><div class="markdown">${markdown(n.Contenu)}</div></div>`).join('')}</section>` : ''}</main>`;
  }
  // Remplacement du contenu de la zone principale en une seule fois.
  document.getElementById('page').innerHTML = html;
  if (Array.isArray(utilisateurs) && utilisateurs.length && tables.includes('Gouv_Visites')) noterVisite();
}

/**
 * Note l'ouverture du document par la personne connectée (table Gouv_Visites, une ligne par personne : nombre
 * d'ouvertures et date de la dernière). Les règles d'accès ne lui montrent que sa ligne ; l'adresse se remplit
 * seule (formule user.Email à la création). Au plus une fois toutes les 6 heures, pour ne pas écrire à chaque clic.
 * Une erreur (règles absentes, lecture seule) est ignorée : l'accueil s'affiche quand même.
 */
let visiteNotee = false;
async function noterVisite() {
  if (visiteNotee) return;
  visiteNotee = true;
  try {
    const miennes = (await lire('Gouv_Visites')) || [];
    const l = miennes[0];
    if (!l) return void await grist.docApi.applyUserActions([['AddRecord', 'Gouv_Visites', null, { Visites: 1 }]]);
    if (l.Derniere_visite && Date.now() / 1000 - l.Derniere_visite < 6 * 3600) return;
    await grist.docApi.applyUserActions([['UpdateRecord', 'Gouv_Visites', l.id, { Visites: (l.Visites || 0) + 1 }]]);
  } catch (e) { /* pas de droit d'écrire : rien à faire */ }
}

// ===== 3. Démarrage =====
// Annonce à Grist que le widget est prêt et réclame l'accès complet
// (nécessaire pour tenter de lire Utilisateurs, Documentation, Parametres).
grist.ready({ requiredAccess: 'full' });
grist.onRecords(afficher);   // se met à jour quand le message d'accueil change
// Premier affichage immédiat, sans attendre un changement de données.
afficher();
</script>
</body>
</html>
